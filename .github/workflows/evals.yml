# Harness evals suite — skills / subagents / workflow, run selectively per PR.
#
# A change detector (evals/scripts/ci-detect.mjs) maps the PR's changed files onto
# the eval tiers, then three jobs run only what changed:
#   • a skill changed        → run that skill's evals   (content tier, no proxy)
#   • an agent changed        → run that agent's evals   (tool tier, LiteLLM proxy)
#   • a CLAUDE.md / agent / engine change → run the workflow tier (tool tier, non-blocking)
# A changed artifact with NO evals is SKIPped (logged), never a failure.
#
# Runs on OpenRouter (EVAL_BACKEND=openrouter). The key lives in the repo Actions
# secret OPENROUTER_API_KEY — never in a file.
#
# MODELS — three independent knobs, one per tier, because the tiers need different strengths:
#   • skills (content)  → cheap DeepSeek. Pure content quality; a small model is fine.
#   • agents (tool)     → claude-sonnet-5. The strict architecture-reviewer eval requires the model
#       to DETECT onion-layer violations in a diff AND cite DevDigest rule identifiers
#       (service-no-fastify, core-purity-no-io — real names in .claude/skills/onion-architecture).
#       Measured: gemini-2.5-flash misreads the diff and approves violating code (1/6) — too weak here.
#   • workflow (tool)   → gemini-2.5-flash. This tier only asserts routing/dispatch/activation TRACES,
#       which a cheap fast model handles (measured 11/13). No reason to pay for sonnet here.
# The judge follows each tier's subject model; case thresholds are 0.6. All three are switchable via
# the workflow_dispatch inputs below (Actions → evals → Run workflow) or by editing the defaults.
name: evals

on:
  pull_request:
    paths:
      - 'evals/**'
      - '.claude/**'
      - 'CLAUDE.md'            # root harness map only — package CLAUDE.md's don't affect the harness
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      skills_model:
        description: 'Model slug for the skills (content) tier'
        default: 'deepseek/deepseek-chat'
      agents_model:
        description: 'Model slug for the agents (tool) tier — needs rule-ID citation, keep strong'
        default: 'anthropic/claude-sonnet-5'
      workflow_model:
        description: 'Model slug for the workflow (tool) tier — trace-only, cheap model is fine'
        default: 'google/gemini-2.5-flash'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  # Model switch (no UI). PR runs have no inputs, so they fall through to the defaults;
  # a manual run overrides from the Actions tab. One knob per tier — see the MODELS note above.
  SKILLS_MODEL: ${{ inputs.skills_model || 'deepseek/deepseek-chat' }}
  AGENTS_MODEL: ${{ inputs.agents_model || 'anthropic/claude-sonnet-5' }}
  WORKFLOW_MODEL: ${{ inputs.workflow_model || 'google/gemini-2.5-flash' }}

jobs:
  # ── Job 1: detect what changed → matrix + skip lines (cheap, key-free gate) ──
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # need base history for the diff

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: evals

      - run: pnpm typecheck        # fail early & cheap on a broken engine
        working-directory: evals

      - id: detect
        name: map changed files onto eval tiers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          else
            CHANGED_FILES="$(git ls-files .claude CLAUDE.md evals)"   # manual run = full sweep
          fi
          export CHANGED_FILES
          node evals/scripts/ci-detect.mjs   # writes skills/agents/run_workflow/skipped_* to $GITHUB_OUTPUT

      - name: summary
        if: always()
        run: |
          {
            echo "### Eval change detection"
            echo "- skills → run: \`${{ steps.detect.outputs.skills }}\`"
            echo "- agents → run: \`${{ steps.detect.outputs.agents }}\`"
            echo "- workflow tier: \`${{ steps.detect.outputs.run_workflow }}\`"
            echo "- SKIP skills (no evals): \`${{ steps.detect.outputs.skipped_skills }}\`"
            echo "- SKIP agents (no evals): \`${{ steps.detect.outputs.skipped_agents }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: skills (content tier) — direct OpenRouter call, no proxy, blocking ──
  skills:
    name: skill:${{ matrix.skill }}
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # No OPENROUTER_BASE_URL → runtime defaults to https://openrouter.ai/api/v1 (direct).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: eval skill
        run: pnpm exec vitest run skills/${{ matrix.skill }}
        env:
          EVAL_MODEL: ${{ env.SKILLS_MODEL }}
          EVAL_JUDGE_MODEL: ${{ env.SKILLS_MODEL }}

  # ── Job 3: agents (tool tier) — LiteLLM proxy, Claude Sonnet subject+judge, single-threaded, blocking ──
  agents:
    name: agent:${{ matrix.agent }}
    needs: detect
    if: needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1            # keep OpenRouter concurrency low (README rate-limit caveat)
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: proxy up
        run: docker compose -f proxy/docker-compose.yml up -d   # reads OPENROUTER_API_KEY from job env
      - run: pnpm proxy:wait                                     # block until the proxy answers
      - name: eval agent
        run: pnpm exec vitest run --no-file-parallelism agents/${{ matrix.agent }}
        env:
          EVAL_MODEL: ${{ env.AGENTS_MODEL }}
          EVAL_JUDGE_MODEL: ${{ env.AGENTS_MODEL }}
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  # ── Job 4: workflow (tool tier) — LiteLLM proxy, Claude Sonnet subject+judge, INFORMATIONAL ──
  # Non-blocking: the systemic routing/activation traces are the least deterministic tier
  # (they depend on the whole on-disk harness), so this stays advisory even on Claude.
  #
  # Runs AFTER `agents` (not alongside it). Both tool tiers dispatch nested subagents through the
  # same OpenRouter account, and running them concurrently doubled the in-flight request count and
  # tripped OpenRouter's `in_flight_budget_exhausted` (402) — which the proxy retried on Retry-After,
  # stalling calls to vitest's 240s timeout. Serializing the two tool tiers halves peak in-flight
  # load. `needs` waits for agents to finish; `always()` keeps this running even when `agents` was
  # skipped (no agent changed) or failed, gated still on run_workflow.
  workflow:
    name: workflow
    needs: [detect, agents]
    if: always() && needs.detect.outputs.run_workflow == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: proxy up
        run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - name: eval workflow
        run: pnpm exec vitest run --no-file-parallelism workflow
        env:
          EVAL_MODEL: ${{ env.WORKFLOW_MODEL }}
          EVAL_JUDGE_MODEL: ${{ env.WORKFLOW_MODEL }}
          # Cases marked useStrongModel (restraint tests) run on this instead of WORKFLOW_MODEL —
          # a MANUAL-ONLY-skill non-activation check needs a model that follows instructions, which
          # cheap gemini can't. OpenRouter slug form (the proxy routes anthropic/* to real sonnet).
          EVAL_STRONG_MODEL: ${{ env.AGENTS_MODEL }}
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
